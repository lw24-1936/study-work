# 运行时编排：Jenkins 流水线负责构建与拉起，这份文件用于本地手工起或者做部署兜底
# 用法：docker compose up -d --build && curl http://localhost:8088/api/todos/health
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: demo-backend:local
    container_name: demo-backend
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/api/todos/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks: [demo-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: demo-frontend:local
    container_name: demo-frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [demo-net]

networks:
  demo-net:
    name: demo-net
