# Kafka 三节点 KRaft 集群（3 broker + 3 controller，角色合并但每节点独立 ID）
#
# 用途：验证副本、ISR、分区 Leader 选举、broker 宕机与恢复、分区重分配等
#       单节点无法演示的行为。
#
# 启动：docker compose -f docker-compose-cluster.yml up -d
# 停止：docker compose -f docker-compose-cluster.yml down -v
#
# 网络说明：本文件不向宿主机发布端口，三个 broker 只在 compose 网络内互相可达
# （kafka-1:9092 / kafka-2:9092 / kafka-3:9092）。CLI 一律用 docker exec 进入容器执行，
# 避免 advertised.listeners 的坑；要让宿主机上的客户端连进来，
# 需要额外增加 PLAINTEXT_HOST 监听器（见单节点示例与教程里的说明）。
#
# 内存：每个 JVM 512MB 堆，三个节点约 2GB

x-kafka-common: &kafka-common
  image: apache/kafka:4.1.2
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_RETENTION_HOURS: 24
    KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    # 内部主题（位移、事务状态）也要 3 副本、min.insync 2，否则它们会成为可靠性短板
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
